<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>study with games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1 class="brand-title">study with games</h1>
    </div>
    <p class="brand-tagline">Level up your focus. Clear your quests. Stay in the zone.</p>
  </header>

  <main class="layout">
    <section class="panel xp-panel" aria-labelledby="xp-heading">
      <div class="panel-head">
        <h2 id="xp-heading">Level &amp; XP</h2>
        <span class="panel-chip" id="level-badge">LVL 1</span>
      </div>
      <div class="xp-meta">
        <span id="xp-current">0</span>
        <span class="xp-sep">/</span>
        <span id="xp-needed">100</span>
        <span class="xp-label">XP</span>
      </div>
      <div class="xp-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="xp-bar-wrap">
        <div class="xp-fill" id="xp-fill"></div>
      </div>
      <p class="xp-hint" id="xp-hint">Complete quests and focus sessions to earn XP.</p>
    </section>

    <section class="panel quest-panel" aria-labelledby="quest-heading">
      <div class="panel-head">
        <h2 id="quest-heading">Quest Log</h2>
        <span class="panel-chip" id="quest-count">0 active</span>
      </div>

      <form class="quest-form" id="quest-form">
        <label class="sr-only" for="quest-input">New quest</label>
        <input
          type="text"
          id="quest-input"
          name="quest"
          placeholder="Add a study quest…"
          maxlength="80"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-primary">Add</button>
      </form>

      <ul class="quest-list" id="quest-list" aria-live="polite"></ul>
      <p class="empty-state" id="quest-empty">No quests yet. Add one to begin.</p>
    </section>

    <section class="panel timer-panel" aria-labelledby="timer-heading">
      <div class="panel-head">
        <h2 id="timer-heading">Pomodoro Timer</h2>
        <span class="panel-chip" id="timer-mode">Focus</span>
      </div>

      <div class="timer-display" id="timer-display" aria-live="polite">
        <span id="timer-minutes">25</span><span class="timer-colon">:</span><span id="timer-seconds">00</span>
      </div>

      <div class="timer-modes" role="group" aria-label="Timer mode">
        <button type="button" class="mode-btn active" data-mode="focus" data-seconds="1500">Focus 25</button>
        <button type="button" class="mode-btn" data-mode="short" data-seconds="300">Break 5</button>
        <button type="button" class="mode-btn" data-mode="long" data-seconds="900">Break 15</button>
      </div>

      <div class="timer-controls">
        <button type="button" class="btn btn-primary" id="timer-toggle">Start</button>
        <button type="button" class="btn btn-ghost" id="timer-reset">Reset</button>
      </div>

      <p class="timer-hint" id="timer-hint">Finish a focus session for +25 XP.</p>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="script.js"></script>
</body>
</html>
